name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  vite-app:
    name: Vite App (root)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules (root)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: root-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            root-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  nextjs-app:
    name: Next.js App (infinity-finance)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules (infinity-finance)
        uses: actions/cache@v4
        with:
          path: infinity-finance/node_modules
          key: nextjs-node-modules-${{ hashFiles('infinity-finance/package-lock.json') }}
          restore-keys: |
            nextjs-node-modules-

      - name: Install dependencies
        working-directory: infinity-finance
        run: npm ci

      - name: Type check
        working-directory: infinity-finance
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key

      - name: Lint
        working-directory: infinity-finance
        run: npm run lint

      - name: Build
        working-directory: infinity-finance
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          NEXT_PUBLIC_URL: http://localhost:3000
